apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: eventsync

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: 350769147036.dkr.ecr.us-east-1.amazonaws.com/eventsync-backend:db431d3

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secrets

          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
