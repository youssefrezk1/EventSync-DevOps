apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: observability

data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs

        prospector.scanner.symlinks: true

        paths:
          - /var/log/containers/*.log

        parsers:
          - container: ~

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

      - drop_event:
          when:
            not:
              equals:
                kubernetes.namespace: "eventsync"

    output.logstash:
      hosts:
        - "logstash.eventsync.internal:5044"
