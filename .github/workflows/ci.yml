---
name: EventSync CI

concurrency:
  group: eventsync-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECRET SECURITY SCAN
  # ============================================================
  security:
    name: Secret Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. TRIVY FILESYSTEM SCAN
  # ============================================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true


  # ============================================================
  # 3. FRONTEND CI
  # ============================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run frontend lint
        id: lint
        continue-on-error: true
        working-directory: app
        run: npm run lint

      - name: Report lint status
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            echo "Frontend lint: PASSED"
          else
            echo "Frontend lint: FAILED"
            echo "Lint errors are currently non-blocking."
            echo "Existing project lint debt must be addressed separately."
          fi

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Frontend dependency audit
        working-directory: app
        run: npm audit --audit-level=critical || true


  # ============================================================
  # 4. BACKEND CI
  # ============================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      STRIPE_SECRET_KEY: sk_test_ci_dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check index.js

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=critical || true


  # ============================================================
  # 5. DOCKER BUILD + IMAGE SECURITY
  # ============================================================
  docker-security:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build frontend image
        run: |
          docker build \
            -t eventsync-frontend:test \
            ./app

      - name: Build backend image
        run: |
          docker build \
            -t eventsync-backend:test \
            ./backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eventsync-frontend:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eventsync-backend:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true


  # ============================================================
  # 6. DOCKER COMPOSE VALIDATION
  # ============================================================
  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create CI environment file
        run: |
          cat <<'EOF' > .env.ci
          PORT=4000
          MONGO_URI=mongodb://eventsync:eventsync_password@mongodb:27017/eventsync?authSource=admin
          JWT_SECRET=test_secret
          JWT_EXPIRES_IN=1d
          FRONTEND_URL=http://localhost:3000
          EMAIL=ci@example.com
          EMAIL_PASSWORD=ci_dummy_password
          CLOUDINARY_NAME=ci_dummy
          CLOUDINARY_API_KEY=ci_dummy
          CLOUDINARY_API_SECRET=ci_dummy
          USER_EMAIL=ci@example.com
          STRIPE_SECRET_KEY=sk_test_ci_dummy
          WORKSHOP_FIXED_PRICE=100
          EOF

      - name: Validate Compose configuration
        env:
          COMPOSE_ENV_FILE: .env.ci
        run: docker compose config


  # ============================================================
  # 7. INTEGRATION TEST
  # ============================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create CI environment file
        run: |
          cat <<'EOF' > .env.ci
          PORT=4000
          MONGO_URI=mongodb://eventsync:eventsync_password@mongodb:27017/eventsync?authSource=admin
          JWT_SECRET=test_secret
          JWT_EXPIRES_IN=1d
          FRONTEND_URL=http://localhost:3000
          EMAIL=ci@example.com
          EMAIL_PASSWORD=ci_dummy_password
          CLOUDINARY_NAME=ci_dummy
          CLOUDINARY_API_KEY=ci_dummy
          CLOUDINARY_API_SECRET=ci_dummy
          USER_EMAIL=ci@example.com
          STRIPE_SECRET_KEY=sk_test_ci_dummy
          WORKSHOP_FIXED_PRICE=100
          EOF

      - name: Start application
        env:
          COMPOSE_ENV_FILE: .env.ci
        run: docker compose up -d --build --wait

      - name: Verify backend health
        run: |
          curl --fail --silent http://localhost:4000/api/health
          echo "Backend health check passed."

      - name: Verify frontend health
        run: |
          curl --fail --silent http://localhost:3000
          echo "Frontend health check passed."

      - name: Show containers
        if: always()
        env:
          COMPOSE_ENV_FILE: .env.ci
        run: docker compose ps

      - name: Show application logs on failure
        if: failure()
        env:
          COMPOSE_ENV_FILE: .env.ci
        run: docker compose logs --no-color

      - name: Shutdown application
        if: always()
        env:
          COMPOSE_ENV_FILE: .env.ci
        run: docker compose down -v


  # ============================================================
  # 8. CI RESULT
  # ============================================================
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest

    needs:
      - security
      - trivy-filesystem
      - frontend
      - backend
      - docker-security
      - docker-compose-validation
      - integration-test

    if: always()

    steps:
      - name: Evaluate pipeline
        run: |
          echo "========================================"
          echo "EventSync CI Pipeline Result"
          echo "========================================"

          echo "Security:             ${{ needs.security.result }}"
          echo "Trivy Filesystem:     ${{ needs.trivy-filesystem.result }}"
          echo "Frontend:             ${{ needs.frontend.result }}"
          echo "Backend:              ${{ needs.backend.result }}"
          echo "Docker Security:      ${{ needs.docker-security.result }}"
          echo "Compose Validation:"
          echo "${{ needs.docker-compose-validation.result }}"
          echo "Integration Test:     ${{ needs.integration-test.result }}"

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security job failed."
            exit 1
          fi

          if [ "${{ needs.trivy-filesystem.result }}" != "success" ]; then
            echo "Trivy filesystem scan failed."
            exit 1
          fi

          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Frontend job failed."
            exit 1
          fi

          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Backend job failed."
            exit 1
          fi

          if [ "${{ needs.docker-security.result }}" != "success" ]; then
            echo "Docker build or image security scan failed."
            exit 1
          fi

          compose_result="${{ needs.docker-compose-validation.result }}"

          if [ "$compose_result" != "success" ]; then
            echo "Docker Compose validation failed."
            exit 1
          fi

          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "Integration test failed."
            exit 1
          fi

          echo "========================================"
          echo "CI PASSED"
          echo "========================================"


  # ============================================================
  # 9. EMAIL NOTIFICATION
  # ============================================================
  # ============================================================
  # 9. EMAIL NOTIFICATION
  # ============================================================
  email:
    name: CI Notification
    runs-on: ubuntu-latest

    needs:
      - security
      - trivy-filesystem
      - frontend
      - backend
      - docker-security
      - docker-compose-validation
      - integration-test
      - ci-result

    if: always()

    steps:
      - name: Prepare CI report
        id: report
        shell: bash
        run: |
          if [ "${{ needs.ci-result.result }}" = "success" ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "icon=✅" >> "$GITHUB_OUTPUT"
            echo "message=All required CI checks completed successfully." >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "message=One or more required CI checks failed." >> "$GITHUB_OUTPUT"
          fi

      - name: Send CI result email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          from: 'EventSync DevOps <${{ secrets.MAIL_USERNAME }}>'
          to: ${{ secrets.MAIL_TO }}

          subject: >-
            ${{ steps.report.outputs.icon }}
            EventSync CI |
            ${{ steps.report.outputs.status }} |
            ${{ github.ref_name }}

          html_body: |
            <!DOCTYPE html>
            <html>
            <body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 12px;">
                <tr>
                  <td align="center">

                    <table width="640" cellpadding="0" cellspacing="0"
                           style="max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">

                      <tr>
                        <td style="background:#111827;padding:28px 32px;">
                          <div style="font-size:14px;color:#9ca3af;letter-spacing:1.5px;">
                            EVENTSYNC DEVOPS
                          </div>

                          <div style="font-size:28px;font-weight:700;color:#ffffff;margin-top:8px;">
                            Continuous Integration Report
                          </div>
                        </td>
                      </tr>

                      <tr>
                        <td style="padding:32px;">

                          <div style="font-size:20px;font-weight:700;color:#111827;">
                            ${{ steps.report.outputs.icon }}
                            CI ${{ steps.report.outputs.status }}
                          </div>

                          <div style="margin-top:8px;margin-bottom:28px;font-size:15px;color:#4b5563;">
                            ${{ steps.report.outputs.message }}
                          </div>

                          <table width="100%" cellpadding="8" cellspacing="0"
                                 style="font-size:14px;border-collapse:collapse;">

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Secret Security
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.security.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Trivy Filesystem
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.trivy-filesystem.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Frontend
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.frontend.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Backend
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.backend.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Docker Security
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.docker-security.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Compose Validation
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.docker-compose-validation.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Integration Test
                              </td>
                              <td style="font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.integration-test.result }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;">
                                Overall CI
                              </td>
                              <td style="font-weight:700;">
                                ${{ needs.ci-result.result }}
                              </td>
                            </tr>

                          </table>

                          <table width="100%" cellpadding="8" cellspacing="0"
                                 style="font-size:13px;margin-top:24px;background:#f9fafb;border-radius:8px;">
                            <tr>
                              <td style="color:#6b7280;">Repository</td>
                              <td>${{ github.repository }}</td>
                            </tr>
                            <tr>
                              <td style="color:#6b7280;">Branch</td>
                              <td>${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="color:#6b7280;">Commit</td>
                              <td style="font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="color:#6b7280;">Triggered by</td>
                              <td>${{ github.actor }}</td>
                            </tr>
                          </table>

                          <div style="margin-top:30px;text-align:center;">
                            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                               style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:7px;font-size:14px;font-weight:600;">
                              View CI Run
                            </a>
                          </div>

                        </td>
                      </tr>

                      <tr>
                        <td style="padding:20px;background:#f9fafb;text-align:center;color:#6b7280;font-size:12px;">
                          EventSync Continuous Integration • GitHub Actions
                        </td>
                      </tr>

                    </table>

                  </td>
                </tr>
              </table>
            </body>
            </html>
