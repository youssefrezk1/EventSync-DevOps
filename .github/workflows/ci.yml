name: EventSync CI
concurrency:
  group: eventsync-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECURITY
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # TRIVY FILESYSTEM SECURITY SCAN
  # ============================================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ============================================================
  # 2. FRONTEND
  # ============================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run frontend lint
        id: lint
        continue-on-error: true
        working-directory: app
        run: npm run lint

      - name: Report lint status
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            echo "Frontend lint: PASSED"
          else
            echo "Frontend lint: FAILED"
            echo "Lint errors are currently non-blocking"
            echo "because the project has existing lint debt."
          fi

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Frontend dependency audit
        working-directory: app
        run: npm audit --audit-level=critical || true

  # ============================================================
  # 3. BACKEND
  # ============================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      STRIPE_SECRET_KEY: sk_test_ci_dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check index.js

      - name: Run backend tests
        working-directory: backend
        env:
          STRIPE_SECRET_KEY: sk_test_ci_dummy
        run: npm test

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=critical || true

  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build frontend image
        run: |
          docker build \
          -t eventsync-frontend:test \
          ./app

      - name: Build backend image
        run: |
          docker build \
          -t eventsync-backend:test \
          ./backend

  # ============================================================
  # TRIVY IMAGE SCAN
  # ============================================================
  trivy-image:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build frontend image
        run: |
          docker build \
          -t eventsync-frontend:test \
          ./app

      - name: Build backend image
        run: |
          docker build \
          -t eventsync-backend:test \
          ./backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eventsync-frontend:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eventsync-backend:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
  # ============================================================
  # DOCKER COMPOSE VALIDATION
  # ============================================================
  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Create test environment file
        run: |
          cat <<EOF > .env
          PORT=4000
          MONGO_URI=mongodb://eventsync:eventsync_password@mongodb:27017/eventsync?authSource=admin
          JWT_SECRET=test_secret
          JWT_EXPIRES_IN=1d
          FRONTEND_URL=http://localhost:3000
          EOF
      - name: Validate compose file
        run: docker compose config

  # ============================================================
  # INTEGRATION TEST
  # ============================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          sleep 30
          curl --fail http://localhost:4000/api/health

      - name: Show containers
        run: docker ps

      - name: Shutdown
        if: always()
        run: docker compose down
  # ============================================================
  # 4. CI RESULT
  # ============================================================
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs:
      - security
      - trivy-filesystem
      - frontend
      - backend
      - docker-build
      - trivy-image
      - docker-compose-validation
      - integration-test

    if: always()

    steps:
      - name: Evaluate pipeline
        run: |

          echo "========================================"
          echo "EventSync CI Pipeline Result"
          echo "========================================"

          echo "Security: ${{ needs.security.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend:  ${{ needs.backend.result }}"

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security job failed."
            exit 1
          fi

          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Frontend job failed."
            exit 1
          fi

          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Backend job failed."
            exit 1
          fi

          if [ "${{ needs.trivy-filesystem.result }}" != "success" ]; then
            echo "Trivy filesystem scan failed."
            exit 1
          fi

          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "Docker build failed."
            exit 1
          fi

          if [ "${{ needs.trivy-image.result }}" != "success" ]; then
            echo "Trivy image scan failed."
            exit 1
          fi

          compose_result="${{ needs.docker-compose-validation.result }}"

          if [ "$compose_result" != "success" ]; then
            echo "Docker compose validation failed."
            exit 1
          fi

          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "Integration test failed."
            exit 1
          fi

          echo "========================================"
          echo "CI PASSED"
          echo "========================================"

  # ============================================================
  # 5. EMAIL NOTIFICATION
  # ============================================================
  email:
    name: Email Notification
    runs-on: ubuntu-latest

    needs:
      - security
      - frontend
      - backend
      - ci-result

    if: always()

    steps:
      - name: Send CI result email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          from: EventSync CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}

          subject: >-
            EventSync CI -
            ${{ needs.ci-result.result == 'success' && 'SUCCESS' || 'FAILED' }}

          body: |
            EventSync CI Pipeline Report
            =============================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Triggered by:
            ${{ github.actor }}

            -----------------------------
            Pipeline Results
            -----------------------------

            Security Scan:
            ${{ needs.security.result }}

            Frontend:
            ${{ needs.frontend.result }}

            Backend:
            ${{ needs.backend.result }}

            Overall CI:
            ${{ needs.ci-result.result }}

            Trivy Filesystem:
            ${{ needs.trivy-filesystem.result }}

            Docker Build:
            ${{ needs.docker-build.result }}

            Trivy Image:
            ${{ needs.trivy-image.result }}
            -----------------------------
            Workflow
            -----------------------------

            ${{ github.server_url }}/${{ github.repository }}
            /actions/runs/${{ github.run_id }}

            EventSync CI has completed.
