---
name: EventSync CD

on:
  workflow_run:
    workflows:
      - EventSync CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: eventsync-cd-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: eventsync-cluster
  K8S_NAMESPACE: eventsync
  FRONTEND_REPOSITORY: eventsync-frontend
  BACKEND_REPOSITORY: eventsync-backend

jobs:

  # ============================================================
  # 1. DEPLOY TO AWS / EKS
  # ============================================================
  deploy:
    name: Deploy EventSync
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      app_url: ${{ steps.verify.outputs.app_url }}

    steps:
      - name: Determine deployment commit
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi

          IMAGE_TAG="${SHA::7}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "Deploying commit: $SHA"
          echo "Image tag: $IMAGE_TAG"

      - name: Checkout deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::350769147036:role/GitHubActions-EventSync-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ steps.ecr-login.outputs.registry }}/${{
            env.FRONTEND_REPOSITORY }}:${{
            steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=eventsync-frontend
          cache-to: type=gha,mode=max,scope=eventsync-frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ steps.ecr-login.outputs.registry }}/${{
            env.BACKEND_REPOSITORY }}:${{
            steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=eventsync-backend
          cache-to: type=gha,mode=max,scope=eventsync-backend

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify Kubernetes access
        run: |
          kubectl auth can-i update deployments \
            --namespace "$K8S_NAMESPACE"

          kubectl get deployment \
            --namespace "$K8S_NAMESPACE"

      - name: Deploy frontend image
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          TAG="${{ steps.meta.outputs.image_tag }}"

          kubectl set image deployment/frontend \
            frontend="${REGISTRY}/${FRONTEND_REPOSITORY}:${TAG}" \
            --namespace "$K8S_NAMESPACE"

      - name: Deploy backend image
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          TAG="${{ steps.meta.outputs.image_tag }}"

          kubectl set image deployment/backend \
            backend="${REGISTRY}/${BACKEND_REPOSITORY}:${TAG}" \
            --namespace "$K8S_NAMESPACE"

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Verify deployed application
        id: verify
        shell: bash
        run: |
          echo "===== DEPLOYMENTS ====="

          kubectl get deployments \
            --namespace "$K8S_NAMESPACE"

          echo
          echo "===== PODS ====="

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -o wide

          ALB_DNS="$(kubectl get ingress eventsync \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"

          if [ -z "$ALB_DNS" ]; then
            echo "Ingress does not currently have an ALB hostname."
            exit 1
          fi

          APP_URL="http://${ALB_DNS}"

          echo
          echo "Application URL: ${APP_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            "${APP_URL}/api/health"

          echo
          echo "Public health verification passed."

          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. DEPLOYMENT EMAIL
  # ============================================================
  email:
    name: Deployment Notification
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: always()

    steps:
      - name: Prepare deployment report
        id: report
        shell: bash
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "status_icon=✅" >> "$GITHUB_OUTPUT"
            echo "status_text=Deployment completed successfully" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "status=SKIPPED" >> "$GITHUB_OUTPUT"
            echo "status_icon=⏭️" >> "$GITHUB_OUTPUT"
            echo "status_text=Deployment was skipped because CI did not pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "status_icon=❌" >> "$GITHUB_OUTPUT"
            echo "status_text=Deployment failed and requires attention" >> "$GITHUB_OUTPUT"
          fi

      - name: Send EventSync deployment email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          from: 'EventSync DevOps <${{ secrets.MAIL_USERNAME }}>'
          to: ${{ secrets.MAIL_TO }}

          subject: >-
            ${{ steps.report.outputs.status_icon }}
            EventSync CD |
            ${{ steps.report.outputs.status }} |
            ${{ github.event_name == 'workflow_run'
                && github.event.workflow_run.head_branch
                || github.ref_name }}

          html_body: |
            <!DOCTYPE html>
            <html>
            <body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 12px;">
                <tr>
                  <td align="center">

                    <table width="640" cellpadding="0" cellspacing="0"
                           style="max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">

                      <tr>
                        <td style="background:#111827;padding:28px 32px;">
                          <div style="font-size:14px;color:#9ca3af;letter-spacing:1.5px;">
                            EVENTSYNC DEVOPS
                          </div>

                          <div style="font-size:28px;font-weight:700;color:#ffffff;margin-top:8px;">
                            Deployment Report
                          </div>
                        </td>
                      </tr>

                      <tr>
                        <td style="padding:32px;">

                          <div style="font-size:20px;font-weight:700;color:#111827;margin-bottom:8px;">
                            ${{ steps.report.outputs.status_icon }}
                            ${{ steps.report.outputs.status }}
                          </div>

                          <div style="font-size:15px;color:#4b5563;margin-bottom:28px;">
                            ${{ steps.report.outputs.status_text }}
                          </div>

                          <table width="100%" cellpadding="8" cellspacing="0"
                                 style="font-size:14px;border-collapse:collapse;">

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;width:35%;">
                                Project
                              </td>
                              <td style="color:#111827;font-weight:600;border-bottom:1px solid #e5e7eb;">
                                EventSync
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Environment
                              </td>
                              <td style="color:#111827;font-weight:600;border-bottom:1px solid #e5e7eb;">
                                Development
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                AWS Region
                              </td>
                              <td style="color:#111827;font-weight:600;border-bottom:1px solid #e5e7eb;">
                                us-east-1
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                EKS Cluster
                              </td>
                              <td style="color:#111827;font-weight:600;border-bottom:1px solid #e5e7eb;">
                                eventsync-cluster
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Branch
                              </td>
                              <td style="color:#111827;font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ github.event_name == 'workflow_run'
                                    && github.event.workflow_run.head_branch
                                    || github.ref_name }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Commit
                              </td>
                              <td style="color:#111827;font-family:monospace;border-bottom:1px solid #e5e7eb;">
                                ${{ github.event_name == 'workflow_run'
                                    && github.event.workflow_run.head_sha
                                    || github.sha }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Image Tag
                              </td>
                              <td style="color:#111827;font-family:monospace;border-bottom:1px solid #e5e7eb;">
                                ${{ needs.deploy.outputs.image_tag || 'N/A' }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;border-bottom:1px solid #e5e7eb;">
                                Triggered By
                              </td>
                              <td style="color:#111827;font-weight:600;border-bottom:1px solid #e5e7eb;">
                                ${{ github.actor }}
                              </td>
                            </tr>

                            <tr>
                              <td style="color:#6b7280;">
                                Application
                              </td>
                              <td style="color:#111827;font-weight:600;">
                                ${{ needs.deploy.outputs.app_url || 'Unavailable' }}
                              </td>
                            </tr>

                          </table>

                          <div style="margin-top:32px;text-align:center;">
                            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                               style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:7px;font-size:14px;font-weight:600;">
                              View GitHub Actions Run
                            </a>
                          </div>

                        </td>
                      </tr>

                      <tr>
                        <td style="padding:20px 32px;background:#f9fafb;color:#6b7280;font-size:12px;text-align:center;">
                          EventSync CI/CD Pipeline<br>
                          GitHub Actions • Amazon ECR • Amazon EKS
                        </td>
                      </tr>

                    </table>

                  </td>
                </tr>
              </table>
            </body>
            </html>
